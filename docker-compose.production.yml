# Reference production layout: one image, three roles, plus Redis. PostgreSQL/PostGIS is expected to be
# a managed service (RDS, Cloud SQL, …). Put a TLS-terminating load balancer in front of `web`.
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
x-app: &app
  image: ${EPFD_IMAGE:-epfd:latest}
  build:
    context: .
    dockerfile: docker/production/Dockerfile
    args:
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
  env_file: .env.production
  restart: unless-stopped
  volumes:
    - uploads:/var/www/html/storage/app
  depends_on:
    redis: { condition: service_healthy }

services:
  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
    ports: ["8080:8080"]

  worker:
    <<: *app
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
    stop_grace_period: 60s
    healthcheck: { disable: true }

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck: { disable: true }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  uploads:
  redisdata:
